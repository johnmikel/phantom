name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: phantom
        uses: ./
        with:
          repo: testdata/tiny
          file: testdata/report.md
          comment: never
      - name: The action finds the made-up code in the sample report
        env:
          MISSING: ${{ steps.phantom.outputs.missing }}
          DOUBTFUL: ${{ steps.phantom.outputs.doubtful }}
          REPORT: ${{ steps.phantom.outputs.report }}
        run: |
          test "$MISSING" = 4 && test "$DOUBTFUL" = 2
          grep -F 'tiny_decode_url()' "$REPORT"
